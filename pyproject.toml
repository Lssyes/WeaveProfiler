[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "weaveprof"
version = "0.4.0"
description = "WeaveProfiler (wp): low-overhead intra-kernel GPU profiling with deterministic 4-gate verification"
requires-python = ">=3.10"

[project.scripts]
weaveprof = "weaveprof.cli:main"

[tool.setuptools.packages.find]
include = ["weaveprof*", "recorders*", "configs*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.cu", "*.cuh", "*.h", "*.config"]
