name: ci

on:
  push:
    branches: ["ci/**", "r/**", "refactor/**", "test/**"]
  pull_request:

jobs:
  offline:
    name: offline (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Dependencies only (mirrors pyproject [project.dependencies] + [dev]). The suite runs from the repo
      # root, and an in-tree install would leave weaveprof.egg-info/ behind, which package_structure rejects.
      - name: install
        run: python -m pip install "numpy>=1.24" "matplotlib>=3.7" "perfetto>=0.59,<1" "coverage>=7"
      - name: public surface
        run: python -B -m unittest -v tests/golden/test_public_surface.py
      - name: code-metrics ratchet
        if: startsWith(github.head_ref || github.ref_name, 'r/') || startsWith(github.head_ref || github.ref_name, 'refactor/') || startsWith(github.head_ref || github.ref_name, 'ci/')
        run: python -B -m unittest -v tests/quality/test_code_metrics_ratchet.py
      - name: golden end-to-end (3 real H20 captures)
        run: python -B -m unittest -v tests/golden/test_golden_audit.py
      - name: legacy offline suite (known failures allowed)
        run: PYTHON=python bash tests/ci_offline.sh
